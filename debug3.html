<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug 5</title>
<style>
body{background:#07101e;color:#e4eaf4;font-family:monospace;padding:16px;font-size:12px}
button{background:#00d4a8;color:#000;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;margin-bottom:8px;display:block;width:100%}
pre{background:#0d1828;border:1px solid #1a2a3d;border-radius:8px;padding:12px;margin-top:10px;white-space:pre-wrap;word-break:break-all;font-size:10px;max-height:600px;overflow-y:auto}
.ok{color:#00d4a8}.err{color:#f87171}.warn{color:#fbbf24}.dim{color:#4e6278}
</style>
</head>
<body>
<h2>&#9881; Debug 5 — Function testi</h2>

<button onclick="t1()">1. Testaa Function (VW tammikuu 2024)</button>
<button onclick="clearLog()">Tyhjenna</button>

<pre id="out">Paina nappia...</pre>

<script>
function log(msg,cls=""){
  const el=document.getElementById("out");
  const s=String(msg).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  el.innerHTML+=`<span class="${cls}">${s}</span>\n`;
}
function clearLog(){document.getElementById("out").innerHTML="";}

async function t1(){
  clearLog();
  log("POST /.netlify/functions/traficom","warn");
  try{
    const r=await fetch("/.netlify/functions/traficom",{method:"POST"});
    log("Status: "+r.status,r.ok?"ok":"err");
    const txt=await r.text();
    log(txt.slice(0,800));
    if(r.ok){
      try{
        const d=JSON.parse(txt);
        log("\nArvo[0]: "+d.value[0],"ok");
        log("Arvoja yhteensa: "+d.value.length,"ok");
      }catch(e){log("JSON parse error: "+e.message,"err");}
    }
  }catch(e){
    log("FETCH ERROR: "+e.message,"err");
  }
}
</script>
</body>
</html>
