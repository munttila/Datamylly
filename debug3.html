<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datamylly Debug 3</title>
<style>
body{background:#07101e;color:#e4eaf4;font-family:monospace;padding:16px;font-size:12px}
button{background:#00d4a8;color:#000;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;margin:4px}
pre{background:#0d1828;border:1px solid #1a2a3d;border-radius:8px;padding:12px;margin-top:10px;white-space:pre-wrap;word-break:break-all;font-size:10px;max-height:500px;overflow-y:auto}
.ok{color:#00d4a8}.err{color:#f87171}.warn{color:#fbbf24}.dim{color:#4e6278}
</style>
</head>
<body>
<h2>&#9881; Debug 3 — Metadata haku</h2>
<p style="color:#4e6278;font-size:10px">Proxy URL: /api/traficom/040_yksmaah_tau_104.px</p>

<button onclick="getMeta()">1. Hae metadata (GET)</button>
<button onclick="testSmall()">2. Testaa pieni kysely</button>
<button onclick="testFuel()">3. Testaa fuel-koodit</button>
<button onclick="clearLog()">Tyhjenna</button>

<pre id="out">Paina "1. Hae metadata" ensin...</pre>

<script>
const PROXY = "/api/traficom/040_yksmaah_tau_104.px";

function log(msg, cls=""){
  document.getElementById("out").innerHTML += `<span class="${cls}">${escHtml(msg)}</span>\n`;
}
function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function clearLog(){ document.getElementById("out").innerHTML=""; }

// Step 1: GET metadata - shows exact variable codes and value codes
async function getMeta(){
  clearLog();
  log("GET " + PROXY, "warn");
  try{
    const r = await fetch(PROXY);
    log("Status: " + r.status + " " + r.statusText, r.ok?"ok":"err");
    if(!r.ok){ log(await r.text(),"err"); return; }
    const d = await r.json();
    log("\n=== MUUTTUJAT JA ARVOT ===", "warn");
    d.variables.forEach(v => {
      log(`\nMUUTTUJA code="${v.code}" text="${v.text}"`, "ok");
      v.values.forEach((val, i) => {
        log(`  [${i}] value="${val}"  text="${v.valueTexts[i]}"`, "dim");
      });
    });
  }catch(e){
    log("FETCH ERROR: "+e.message, "err");
    log("Onko netlify.toml paivitetty ja deployttu?");
  }
}

// Step 2: small query with first values from metadata
async function testSmall(){
  clearLog();
  log("Testataan pienella kyselyla...", "warn");
  const body = JSON.stringify({
    query:[
      {code:"Make", selection:{filter:"item", values:["Volkswagen"]}},
      {code:"Year of first registration", selection:{filter:"item", values:["2024"]}},
      {code:"Driving power", selection:{filter:"item", values:["Total"]}},
      {code:"Month", selection:{filter:"item", values:["2024M01"]}}
    ],
    response:{format:"json"}
  });
  log("Query:\n" + body);
  try{
    const r = await fetch(PROXY, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body
    });
    log("\nStatus: " + r.status + " " + r.statusText, r.ok?"ok":"err");
    const txt = await r.text();
    log("Response:\n" + txt.slice(0,600));
    if(r.ok){
      const d = JSON.parse(txt);
      log("\nArvo[0]: " + d.value[0], "ok");
      log("Metatieto: " + JSON.stringify(d.role||{}));
    }
  }catch(e){
    log("FETCH ERROR: "+e.message,"err");
  }
}

// Step 3: test exact fuel type codes
async function testFuel(){
  clearLog();
  log("Haetaan ensin metadata fuel-koodeja varten...", "warn");
  try{
    const r = await fetch(PROXY);
    const d = await r.json();
    const fuelVar = d.variables.find(v =>
      v.code === "Driving power" ||
      v.text === "Driving power" ||
      v.code.toLowerCase().includes("fuel") ||
      v.code.toLowerCase().includes("driv") ||
      v.code.toLowerCase().includes("power")
    );
    if(fuelVar){
      log("Fuel-muuttuja loydetty: code=" + fuelVar.code, "ok");
      log("Kaikki fuel-arvot:");
      fuelVar.values.forEach((v,i) => log(`  "${v}" -> "${fuelVar.valueTexts[i]}"`, "dim"));

      // Now test with actual first fuel value
      log("\nTestataan ensimmaisella fuel-arvolla: " + fuelVar.values[0], "warn");
      const body = JSON.stringify({
        query:[
          {code:"Make", selection:{filter:"item", values:["Volkswagen"]}},
          {code:"Year of first registration", selection:{filter:"item", values:["2024"]}},
          {code:fuelVar.code, selection:{filter:"item", values:[fuelVar.values[0]]}},
          {code:"Month", selection:{filter:"item", values:["2024M01"]}}
        ],
        response:{format:"json"}
      });
      const r2 = await fetch(PROXY, {method:"POST", headers:{"Content-Type":"application/json"}, body});
      log("Status: " + r2.status, r2.ok?"ok":"err");
      const txt = await r2.text();
      log(txt.slice(0,400));
    } else {
      log("Fuel-muuttujaa ei loydy! Kaikki muuttujat:", "err");
      d.variables.forEach(v => log(`  code="${v.code}" text="${v.text}"`));
    }
  }catch(e){
    log("ERROR: "+e.message,"err");
  }
}
</script>
</body>
</html>
