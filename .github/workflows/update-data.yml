name: Paivita Traficom-data

on:
  schedule:
    - cron: '0 6 3 * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hae data
        run: python fetch_data.py
      - name: Commit
        run: |
          git config user.name "Datamylly Bot"
          git config user.email "bot@datamylly"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "Data $(date +'%Y-%m-%d')"
          git push
