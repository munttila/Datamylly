name: Päivitä data kuukausittain

on:
  schedule:
    - cron: '0 6 3 * *'
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python fetch_data.py
      - run: |
          git config user.name "Datamylly Bot"
          git config user.email "bot@datamylly"
          git add data/
          git diff --staged --quiet || git commit -m "Data $(date +'%Y-%m-%d')"
          git push
